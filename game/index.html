<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Bay — an original open-world crime game in the browser. Six jobs, one sun-soaked island city.">
<title>Solmar Bay — a sun-soaked crime story</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #141a2e;
  }
  #game, #hud {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* The HUD sits over the 3D canvas and never takes the mouse. */
  #hud { pointer-events: none; }
  /* Screen-reader status line: off-screen, announced politely. */
  #status {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="hud"></canvas>
<p id="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
